<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f6f2">
  <title>Reset password · MyDiary</title>
  <link rel="stylesheet" href="theme.css">
  <style>
    .reset-page { min-height: 100vh; display: grid; place-items: center; padding: 28px 16px; }
    .reset-wrap { width: min(100%, 500px); }
    .reset-brand { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 20px; }
    .reset-mark { display: grid; place-items: center; width: 38px; height: 38px; border-radius: 12px; background: var(--primary); color: var(--primary-foreground); font-size: 17px; }
    .reset-brand-name { margin: 0; font-weight: 650; font-size: 15px; }
    .reset-card > .card-header { padding: 22px 24px 11px; }
    .reset-card > .card-content { padding: 10px 24px 22px; }
    .reset-fields { display: grid; gap: 16px; }
    .reset-fields .field + .field { margin-top: 0; }
    .otp-group { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px; }
    .otp-digit { width: 100%; min-width: 0; min-height: 44px; padding: 6px; text-align: center; font-size: 17px; font-weight: 600; }
    .reset-actions { display: grid; gap: 12px; margin-top: 19px; }
    .reset-actions .button { width: 100%; min-height: 40px; }
    .reset-back { text-align: center; color: var(--primary); font-size: 12px; font-weight: 550; }
    .reset-message { align-items: flex-start; margin-top: 18px; }
    .reset-message p { margin: 0; color: var(--muted-foreground); font-size: 11px; }
    .reset-message strong { display: block; margin-bottom: 2px; font-size: 11px; color: var(--foreground); }
    @media (max-width: 480px) {
      .reset-card > .card-header { padding: 18px 17px 9px; }
      .reset-card > .card-content { padding: 10px 17px 18px; }
      .otp-group { gap: 5px; }
    }
  </style>
</head>
<body>
  <main class="reset-page">
    <div class="reset-wrap" data-testid="reset-panel">
      <header class="reset-brand">
        <div class="reset-mark" aria-hidden="true">✦</div>
        <p class="reset-brand-name">MyDiary</p>
      </header>

      <section class="card reset-card" aria-labelledby="reset-heading">
        <div class="card-header">
          <div>
            <h1 class="card-title" id="reset-heading">Reset your password</h1>
            <p class="card-description">We’ll help you securely get back into your account.</p>
          </div>
        </div>
        <div class="card-content">
          <form aria-label="Password reset" onsubmit="return false">
            <div class="reset-fields">
              <div class="field" data-testid="reset-email">
                <label class="label" for="reset-email-input">Account email</label>
                <input class="input" id="reset-email-input" name="email" type="email" autocomplete="email" placeholder="name@example.com" required data-testid="reset-email-input">
                <span class="hint">We’ll send a one-time reset code if the address matches an account.</span>
              </div>

              <div class="field" data-testid="reset-code">
                <span class="label" id="reset-code-label">Reset code</span>
                <div class="otp-group" role="group" aria-labelledby="reset-code-label">
                  <input class="input otp-digit" type="text" inputmode="numeric" maxlength="1" aria-label="Code digit 1" data-testid="reset-code-digit-1">
                  <input class="input otp-digit" type="text" inputmode="numeric" maxlength="1" aria-label="Code digit 2" data-testid="reset-code-digit-2">
                  <input class="input otp-digit" type="text" inputmode="numeric" maxlength="1" aria-label="Code digit 3" data-testid="reset-code-digit-3">
                  <input class="input otp-digit" type="text" inputmode="numeric" maxlength="1" aria-label="Code digit 4" data-testid="reset-code-digit-4">
                  <input class="input otp-digit" type="text" inputmode="numeric" maxlength="1" aria-label="Code digit 5" data-testid="reset-code-digit-5">
                  <input class="input otp-digit" type="text" inputmode="numeric" maxlength="1" aria-label="Code digit 6" data-testid="reset-code-digit-6">
                </div>
              </div>

              <div class="field" data-testid="reset-new-password">
                <label class="label" for="reset-password-input">New password</label>
                <input class="input" id="reset-password-input" name="new-password" type="password" autocomplete="new-password" placeholder="Choose a new password" required data-testid="reset-password-input">
              </div>
            </div>
            <div class="reset-actions">
              <button class="button" type="button" data-testid="reset-submit" onclick="showStatus('If the email matches an account, AppManager will send a reset code. Enter the code and your new password to finish.')">Send reset instructions</button>
              <a class="reset-back" href="sign-in-and-account.html" data-testid="reset-back-to-sign-in">Back to sign in</a>
            </div>
          </form>
          <div class="alert reset-message" data-testid="reset-message" role="status" aria-live="polite">
            <span aria-hidden="true">ⓘ</span>
            <div><strong>How it works</strong><p>Start with your account email. When the code arrives, enter it here along with a new password.</p></div>
          </div>
          <p class="status-message" id="page-status" data-testid="page-status" role="status" aria-live="polite" hidden></p>
        </div>
      </section>
    </div>
  </main>
  <script>
    function showStatus(message) {
      const status = document.querySelector('[data-testid="page-status"]');
      status.textContent = message;
      status.hidden = false;
    }
  </script>
</body>
</html>
