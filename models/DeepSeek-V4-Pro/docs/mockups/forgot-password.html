<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MyDiary — Forgot password</title>
<link rel="stylesheet" href="mockup.css">
</head>
<body class="auth">
<div class="auth-card" data-testid="forgot-card">
  <div class="auth-logo" data-testid="app-logo">MD</div>
  <h1 data-testid="page-title">Reset your password</h1>
  <p class="muted small">We will send a code to your email.</p>
  <div class="stack mt">
    <label class="field">
      <span class="field-label">Email</span>
      <input class="input" type="email" placeholder="you@example.com" data-testid="email-input">
    </label>
    <label class="field">
      <span class="field-label">Reset code</span>
      <input class="input" type="text" placeholder="123456" data-testid="code-input">
    </label>
    <label class="field">
      <span class="field-label">New password</span>
      <input class="input" type="password" placeholder="••••••••" data-testid="new-password-input">
    </label>
    <a class="btn" href="signin.html" data-testid="reset-submit">Reset password</a>
    <a class="btn-link small" href="signin.html" data-testid="link-back-signin">Back to sign in</a>
  </div>
</div>
<script>function toast(m){var t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(function(){t.remove()},1800)}</script>
</body>
</html>
