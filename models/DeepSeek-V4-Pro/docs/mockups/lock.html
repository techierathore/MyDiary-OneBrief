<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MyDiary — Unlock</title>
<link rel="stylesheet" href="mockup.css">
</head>
<body class="auth">
<div class="auth-card" data-testid="unlock-card">
  <div class="auth-logo" data-testid="app-logo">MD</div>
  <h1 data-testid="page-title">Welcome back</h1>
  <p class="muted small">Unlock your journal.</p>
  <div class="stack mt">
    <label class="field">
      <span class="field-label">PIN</span>
      <input class="input" type="password" placeholder="••••" data-testid="pin-input">
    </label>
    <a class="btn" href="home.html" data-testid="unlock-submit">Unlock</a>
    <button class="btn btn-outline" onclick="toast('Fingerprint or face')" data-testid="unlock-biometric">Use fingerprint or face</button>
    <a class="btn-link small" href="signin.html" data-testid="link-signin">Sign in with a different account</a>
  </div>
</div>
<script>function toast(m){var t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(function(){t.remove()},1800)}</script>
</body>
</html>
