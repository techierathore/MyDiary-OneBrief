<main class="content">
  <header class="topbar" data-testid="topbar"><h1 class="page-title" data-testid="page-title">Lock and reminders</h1></header>
  <div class="page-body stack">

<div class="card" data-testid="lock-card">
  <div class="card-header"><div class="card-title">Lock</div></div>
  <div class="card-content stack">
    <label class="field"><span class="field-label">PIN</span><input class="input" type="password" placeholder="••••" value="1234" data-testid="pin-input"></label>
    <div class="flex between"><span>Use fingerprint or face</span><span class="switch on" data-testid="biometric-switch"></span></div>
    <a class="btn btn-outline btn-sm" href="lock.html" data-testid="test-lock">Test lock screen</a>
  </div>
</div>
<div class="card" data-testid="reminder-card">
  <div class="card-header"><div class="card-title">Journaling reminders</div></div>
  <div class="card-content stack">
    <label class="field"><span class="field-label">Time</span><input class="input" type="time" value="20:00" data-testid="reminder-time"></label>
    <div class="flex wrap" data-testid="reminder-days">
      <span class="badge badge-secondary">Mon</span><span class="badge badge-secondary">Tue</span><span class="badge badge-secondary">Wed</span><span class="badge badge-secondary">Thu</span><span class="badge badge-secondary">Fri</span><span class="badge badge-outline">Sat</span><span class="badge badge-outline">Sun</span>
    </div>
    <button class="btn" onclick="toast('Reminders saved')" data-testid="save-security">Save</button>
  </div>
</div>

  </div>
</main>
<script>function toast(m){var t=document.createElement("div");t.className="toast";t.textContent=m;document.body.appendChild(t);setTimeout(function(){t.remove()},1800)}</script>
</body>
