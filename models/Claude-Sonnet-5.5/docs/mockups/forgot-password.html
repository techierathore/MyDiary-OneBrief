<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MyDiary — Forgot password</title><link rel="stylesheet" href="mockup.css"></head><body data-screen="forgot-password"><main class="auth" data-testid="auth-shell"><div class="auth-box"><div class="brand" data-testid="brand">📔 MyDiary</div><section class="card" data-testid="forgot-form"><h3>Reset your password</h3><div class="steps"><span class="badge">1 Ask for a code</span><span class="badge outline">2 Choose a new password</span></div><div class="field"><label class="label">Email</label><input class="input" type="email" value="maya@example.com" placeholder="" data-testid="forgot-email"></div><button class="btn primary full" onclick="tfMsg('A reset code was sent to maya@example.com')" data-testid="forgot-send">Send reset code</button><div class="alert ok" role="alert" data-tf-state="success" data-testid="forgot-sent-note">A reset code was sent. Enter it below with your new password.</div><div class="field"><label class="label">Reset code</label><input class="input" type="text" value="482915" placeholder="" data-testid="forgot-code"></div><div class="field"><label class="label">New password</label><input class="input" type="password" value="••••••••" placeholder="" data-testid="forgot-new"></div><a class="btn primary full" href="signin.html" data-testid="forgot-submit">Set new password</a><div class="alert ok" role="alert" data-tf-state="success" data-testid="forgot-done">Your password was changed. Sign in with the new one.</div></section><p class="muted center"><a class="btn link" href="signin.html" data-testid="forgot-back">Back to sign in</a></p></div></main><div id="tf-toast" class="toast" data-testid="toast"></div><script>
function tfMsg(t){var e=document.getElementById('tf-toast');e.textContent=t;e.style.display='block';clearTimeout(window.__tf);window.__tf=setTimeout(function(){e.style.display='none'},2600)}
function tfOpen(id){document.getElementById(id).showModal()}
function tfClose(id){document.getElementById(id).close()}
</script></body></html>
