<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MyDiary — Unlock</title><link rel="stylesheet" href="mockup.css"></head><body data-screen="lock"><main class="auth" data-testid="auth-shell"><div class="auth-box"><div class="brand" data-testid="brand">📔 MyDiary</div><section class="card" data-testid="lock-card"><h3>MyDiary is locked</h3><div class="pin" data-testid="lock-pin-dots">● ● ● ○</div><div class="field"><label class="label">PIN</label><input class="input" type="password" value="" placeholder="" data-testid="lock-pin"></div><a class="btn primary full" href="home.html" data-testid="lock-unlock">Unlock</a><button class="btn outline full" onclick="tfMsg('Fingerprint accepted')" data-testid="lock-bio">Use fingerprint or face</button><div class="alert danger" role="alert" data-tf-state="error" data-testid="lock-error">That PIN is not right.</div></section></div></main><div id="tf-toast" class="toast" data-testid="toast"></div><script>
function tfMsg(t){var e=document.getElementById('tf-toast');e.textContent=t;e.style.display='block';clearTimeout(window.__tf);window.__tf=setTimeout(function(){e.style.display='none'},2600)}
function tfOpen(id){document.getElementById(id).showModal()}
function tfClose(id){document.getElementById(id).close()}
</script></body></html>
