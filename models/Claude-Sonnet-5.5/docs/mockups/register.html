<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MyDiary — Create account</title><link rel="stylesheet" href="mockup.css"></head><body data-screen="register"><main class="auth" data-testid="auth-shell"><div class="auth-box"><div class="brand" data-testid="brand">📔 MyDiary</div><section class="card" data-testid="register-form"><h3>Create your account</h3><div class="field"><label class="label">First name</label><input class="input" type="text" value="Maya" placeholder="" data-testid="register-first"></div><div class="field"><label class="label">Last name</label><input class="input" type="text" value="Rao" placeholder="" data-testid="register-last"></div><div class="field"><label class="label">Email</label><input class="input" type="email" value="maya@example.com" placeholder="" data-testid="register-email"></div><div class="field"><label class="label">Password</label><input class="input" type="password" value="••••••••" placeholder="" data-testid="register-password"></div><div class="field"><label class="label">Confirm password</label><input class="input" type="password" value="••••••••" placeholder="" data-testid="register-confirm"></div><a class="btn primary full" href="home.html" data-testid="register-submit">Create account</a><div class="alert danger" role="alert" data-tf-state="error" data-testid="register-error-mismatch">The two passwords do not match.</div><div class="alert danger" role="alert" data-tf-state="error" data-testid="register-error-exists">An account with this email already exists. Sign in instead.</div></section><p class="muted center">Already have an account? <a class="btn link" href="signin.html" data-testid="register-signin">Sign in</a></p></div></main><div id="tf-toast" class="toast" data-testid="toast"></div><script>
function tfMsg(t){var e=document.getElementById('tf-toast');e.textContent=t;e.style.display='block';clearTimeout(window.__tf);window.__tf=setTimeout(function(){e.style.display='none'},2600)}
function tfOpen(id){document.getElementById(id).showModal()}
function tfClose(id){document.getElementById(id).close()}
</script></body></html>
