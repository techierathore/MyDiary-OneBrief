<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MyDiary — Sign in</title>
<style>
:root{
  --background:oklch(1 0 0);--foreground:oklch(0.1450 0 0);
  --card:oklch(1 0 0);--card-foreground:oklch(0.1450 0 0);
  --popover:oklch(1 0 0);--popover-foreground:oklch(0.1450 0 0);
  --primary:oklch(0.2050 0 0);--primary-foreground:oklch(0.9850 0 0);
  --secondary:oklch(0.9700 0 0);--secondary-foreground:oklch(0.2050 0 0);
  --muted:oklch(0.9700 0 0);--muted-foreground:oklch(0.5560 0 0);
  --accent:oklch(0.9700 0 0);--accent-foreground:oklch(0.2050 0 0);
  --destructive:oklch(0.5770 0.2450 27.3250);--destructive-foreground:oklch(1 0 0);
  --border:oklch(0.9220 0 0);--input:oklch(0.9220 0 0);--ring:oklch(0.7080 0 0);
  --radius:0.625rem;
  --sidebar:oklch(0.9850 0 0);--sidebar-foreground:oklch(0.1450 0 0);
  --sidebar-primary:oklch(0.2050 0 0);--sidebar-primary-foreground:oklch(0.9850 0 0);
  --sidebar-accent:oklch(0.9700 0 0);--sidebar-accent-foreground:oklch(0.2050 0 0);
  --sidebar-border:oklch(0.9220 0 0);
  --alert-success:oklch(0.55 0.20 142);--alert-info:oklch(0.50 0.20 255);
  --alert-warning:oklch(0.68 0.18 55);--alert-danger:oklch(0.55 0.22 27);
}
*{box-sizing:border-box}
body{margin:0;background:var(--background);color:var(--foreground);
  font:14px/1.5 Inter,ui-sans-serif,system-ui,sans-serif}
a{color:inherit;text-decoration:none}
.icon{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;
  stroke-linecap:round;stroke-linejoin:round;flex:none}
/* layout shell */
.shell{display:flex;min-height:100vh}
.sidebar{width:16rem;flex:none;background:var(--sidebar);color:var(--sidebar-foreground);
  border-right:1px solid var(--sidebar-border);display:flex;flex-direction:column}
.sidebar-header{display:flex;align-items:center;gap:10px;padding:16px 16px 8px}
.logo-mark{width:32px;height:32px;border-radius:8px;background:var(--sidebar-primary);
  color:var(--sidebar-primary-foreground);display:flex;align-items:center;justify-content:center}
.sidebar-header b{font-size:15px}
.sidebar-header small{display:block;color:var(--muted-foreground);font-size:11px}
.sidebar-content{flex:1;padding:8px 12px;overflow:auto}
.group-label{font-size:11px;font-weight:500;color:var(--muted-foreground);padding:16px 8px 4px}
.nav-item{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:6px;
  font-size:13px;color:var(--sidebar-foreground);margin:1px 0}
.nav-item:hover{background:var(--sidebar-accent)}
.nav-item.active{background:var(--sidebar-accent);color:var(--sidebar-accent-foreground);
  font-weight:500}
.sidebar-footer{border-top:1px solid var(--sidebar-border);padding:10px 12px;display:flex;
  align-items:center;gap:10px}
.avatar{width:30px;height:30px;border-radius:999px;background:var(--muted);
  display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600}
.inset{flex:1;display:flex;flex-direction:column;min-width:0}
.pagebar{height:56px;border-bottom:1px solid var(--border);display:flex;align-items:center;
  gap:12px;padding:0 24px}
.pagebar h1{font-size:16px;font-weight:600;margin:0}
.pagebar .spacer{flex:1}
.content{padding:24px;max-width:960px}
.stack>*+*{margin-top:24px}
.grid{display:grid;gap:16px}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:36px;
  padding:0 16px;border-radius:calc(var(--radius) - 4px);border:1px solid transparent;
  font-size:13.5px;font-weight:500;cursor:pointer;background:var(--primary);
  color:var(--primary-foreground)}
.btn:hover{opacity:.9}
.btn-outline{background:var(--background);color:var(--foreground);border-color:var(--border)}
.btn-ghost{background:transparent;color:var(--foreground)}
.btn-destructive{background:var(--destructive);color:var(--destructive-foreground)}
.btn-sm{height:30px;padding:0 10px;font-size:12.5px}
.icon-btn{width:30px;height:30px;border-radius:6px;border:none;background:transparent;
  cursor:pointer;color:var(--muted-foreground);display:inline-flex;align-items:center;
  justify-content:center}
.icon-btn:hover{background:var(--accent);color:var(--foreground)}
/* cards */
.card{background:var(--card);color:var(--card-foreground);border:1px solid var(--border);
  border-radius:var(--radius);box-shadow:0 1px 2px oklch(0 0 0/4%)}
.card-header{padding:16px 16px 0}
.card-title{font-weight:600;font-size:14.5px;margin:0}
.card-desc{color:var(--muted-foreground);font-size:12.5px;margin:2px 0 0}
.card-content{padding:16px}
.card-footer{padding:0 16px 16px;display:flex;gap:8px;align-items:center}
/* forms */
.label{font-size:13px;font-weight:500;display:block;margin:0 0 6px}
.input,.select,.textarea{width:100%;height:36px;border:1px solid var(--input);border-radius:
  calc(var(--radius) - 4px);background:var(--background);padding:0 12px;font:inherit;color:inherit}
.textarea{height:auto;min-height:80px;padding:10px 12px;resize:vertical}
.field{margin:0}
.field+.field{margin-top:16px}
.hint{font-size:12px;color:var(--muted-foreground);margin-top:4px}
/* badges, chips, alerts */
.badge{display:inline-flex;align-items:center;gap:6px;height:20px;padding:0 8px;border-radius:999px;
  font-size:11.5px;font-weight:500;background:var(--primary);color:var(--primary-foreground)}
.badge.secondary{background:var(--secondary);color:var(--secondary-foreground)}
.badge.outline{background:transparent;color:var(--foreground);border:1px solid var(--border)}
.badge.success{background:color-mix(in oklab,var(--alert-success) 15%,white);
  color:var(--alert-success)}
.badge.warning{background:color-mix(in oklab,var(--alert-warning) 20%,white);
  color:oklch(0.45 0.12 55)}
.chip{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:999px;
  background:var(--secondary);color:var(--secondary-foreground);font-size:12.5px}
.alert{display:flex;gap:10px;padding:12px 14px;border-radius:calc(var(--radius) - 4px);
  border:1px solid var(--border);background:var(--background);font-size:13px}
.alert.warning{border-color:color-mix(in oklab,var(--alert-warning) 45%,var(--border));
  background:color-mix(in oklab,var(--alert-warning) 10%,white)}
.alert.info{border-color:color-mix(in oklab,var(--alert-info) 40%,var(--border));
  background:color-mix(in oklab,var(--alert-info) 8%,white)}
/* table */
.table{width:100%;border-collapse:collapse;font-size:13px}
.table th{text-align:left;font-weight:500;color:var(--muted-foreground);font-size:12px;
  padding:8px 10px;border-bottom:1px solid var(--border)}
.table td{padding:10px;border-bottom:1px solid var(--border);vertical-align:middle}
/* tabs */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border)}
.tab{padding:8px 14px;font-size:13.5px;color:var(--muted-foreground);border-bottom:2px solid
  transparent;margin-bottom:-1px;cursor:pointer}
.tab.active{color:var(--foreground);font-weight:500;border-bottom-color:var(--foreground)}
/* switch */
.switch{width:38px;height:22px;border-radius:999px;background:var(--input);border:none;
  position:relative;cursor:pointer;flex:none}
.switch.on{background:var(--primary)}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;
  border-radius:999px;background:white;transition:left .15s}
.switch.on::after{left:18px}
/* dialog */
.dialog-backdrop{position:fixed;inset:0;background:oklch(0 0 0/45%);display:flex;
  align-items:center;justify-content:center;padding:24px;z-index:20}
.dialog{width:100%;max-width:440px;background:var(--popover);color:var(--popover-foreground);
  border:1px solid var(--border);border-radius:var(--radius);box-shadow:0 10px 30px oklch(0 0 0/18%)}
.dialog-head{display:flex;align-items:flex-start;gap:12px;padding:16px 16px 0}
.dialog-head h2{font-size:15px;font-weight:600;margin:0}
.dialog-head p{color:var(--muted-foreground);font-size:12.5px;margin:2px 0 0}
.dialog-head .spacer{flex:1}
.dialog-body{padding:16px}
.dialog-foot{display:flex;justify-content:flex-end;gap:8px;padding:0 16px 16px}
/* stat tile */
.stat{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  padding:14px 16px}
.stat b{font-size:22px;display:block}
.stat span{color:var(--muted-foreground);font-size:12px}
/* empty state */
.empty{display:flex;flex-direction:column;align-items:center;gap:8px;padding:32px;
  color:var(--muted-foreground);text-align:center;border:1px dashed var(--border);
  border-radius:var(--radius)}
/* ---- sign-in screen (CenteredPanel) ---- */
.auth-bg{min-height:100vh;background:var(--muted);display:flex;align-items:center;
  justify-content:center;padding:24px}
.auth-card{width:100%;max-width:380px;background:var(--card);color:var(--card-foreground);
  border:1px solid var(--border);border-radius:var(--radius);
  box-shadow:0 1px 2px oklch(0 0 0/4%);padding:28px}
.auth-brand{text-align:center}
.auth-brand .logo-mark{width:40px;height:40px;border-radius:10px;margin:0 auto}
.auth-brand b{display:block;font-size:18px;margin-top:10px}
.auth-sub{color:var(--muted-foreground);font-size:12.5px;margin:2px 0 0}
.auth-form{margin-top:24px}
.auth-form>*+*{margin-top:16px}
.btn-full{width:100%}
.divider{height:1px;background:var(--border);margin:20px 0 16px}
.auth-links{display:flex;flex-direction:column;align-items:center;gap:8px}
.auth-links a{font-size:13px;color:var(--foreground)}
.auth-links a:hover{text-decoration:underline}
.auth-foot{font-size:11.5px;color:var(--muted-foreground);text-align:center;margin:20px 0 0}
</style>
</head>
<body>
<div class="auth-bg">
  <main class="auth-card" data-testid="signin-card">
    <div class="auth-brand">
      <div class="logo-mark" data-testid="signin-logo"><svg class="icon" viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V2H6.5A2.5 2.5 0 0 0 4 4.5v15zM4 19.5A2.5 2.5 0 0 0 6.5 22H20v-5"/></svg></div>
      <b>MyDiary</b>
      <p class="auth-sub">Your private journal — it stays on this device.</p>
    </div>

    <form class="auth-form" action="home.html">
      <div class="field">
        <label class="label" for="signin-email">Email</label>
        <input class="input" type="email" id="signin-email" data-testid="signin-email"
               value="maya.rao@example.org" data-tf-sample autocomplete="email">
      </div>
      <div class="field">
        <label class="label" for="signin-password">Password</label>
        <input class="input" type="password" id="signin-password" data-testid="signin-password"
               value="RunningCoffee2026!" data-tf-sample autocomplete="current-password">
      </div>
      <div class="alert warning" role="alert" data-tf-state="error" data-testid="signin-free-device-refusal">
        <svg class="icon" viewBox="0 0 24 24"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>
        <div>This account already has its one free device in use. A paid licence allows more.</div>
      </div>
      <a class="btn btn-full" href="home.html" data-testid="signin-submit">Sign in</a>
    </form>

    <div class="divider"></div>

    <div class="auth-links">
      <a href="signin-create-account.html" data-testid="signin-register-link">New here? Create an account</a>
      <a href="signin-forgot-password.html" data-testid="signin-forgot-link">Forgot password?</a>
    </div>

    <p class="auth-foot">Sign-in is handled by AppManager; your journal text is never sent there.</p>
  </main>
</div>
</body>
</html>
